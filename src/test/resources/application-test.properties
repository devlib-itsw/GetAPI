# ============================================================
# 통합 테스트 전용 설정 (application-test.properties)
# ============================================================

# 인메모리 H2 DB (테스트마다 격리)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
spring.jpa.show-sql=false

# JWT — 최소 256비트 더미 키
jwt.secret-key=integration-test-secret-key-must-be-at-least-256-bits-long-padding

# Google OAuth2 — 더미 (실제 인증 요청 없음)
spring.security.oauth2.client.registration.google.client-id=dummy-test-client-id
spring.security.oauth2.client.registration.google.client-secret=dummy-test-client-secret
spring.security.oauth2.client.registration.google.scope=email,profile

# IMAP — 더미 (ImapIdleChannelAdapter 는 @MockBean 으로 대체됨)
imap.username=test@test.com
imap.password=testpassword

# Redis — 로컬 Redis 사용 (테스트 환경에서 실행 중이어야 함)
spring.redis.host=localhost
spring.redis.port=6379

# 로그 수준 낮춤
logging.level.root=WARN
logging.level.com.getapi=INFO
logging.level.org.springframework.security=WARN
