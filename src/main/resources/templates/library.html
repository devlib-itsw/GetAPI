<!DOCTYPE html>
<html lang="ko" layout:decorate="~{common/layout}">

<head>
    <title layout:fragment="title">API Library - GetAPI</title>
    <th:block layout:fragment="metatags">
        <meta name="description" content="원하는 API를 찾아보세요">
    </th:block>
</head>

<body>
    <!-- MAIN -->
    <th:block layout:fragment="content">
        <main class="main-content bg-muted-30">
            <div class="container py-8">
                <!-- Page Title -->
                <div class="mb-8">
                    <h1 class="text-3xl font-bold text-foreground">API Library</h1>
                    <p class="mt-2 text-muted">다양한 검증된 API를 찾아보세요</p>
                </div>

                <!-- Search & Filter -->
                <div class="mb-6 flex flex-wrap gap-4 items-center justify-between">
                    <div class="flex flex-1 items-center gap-2" style="max-width:36rem">
                        <div style="position:relative; flex:1">
                            <svg style="position:absolute; left:0.75rem; top:50%; transform:translateY(-50%)"
                                class="icon text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <circle cx="11" cy="11" r="8" />
                                <path d="m21 21-4.3-4.3" />
                            </svg>
                            <input class="input" type="text" placeholder="API 이름, 태그, 개발자로 검색..."
                                style="padding-left:2.5rem">
                        </div>
                        <div class="search-filter-wrapper">
                            <button class="search-filter-btn" id="library-filter-btn" type="button">
                                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3" />
                                </svg>
                                필터
                                <span class="search-filter-count" id="library-filter-count">5</span>
                                <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2">
                                    <path d="m6 9 6 6 6-6" />
                                </svg>
                            </button>
                            <div class="search-filter-dropdown" id="library-filter-dropdown">
                                <label class="filter-check-item checked" data-filter="all"><svg class="cs-check"
                                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="20 6 9 17 4 12" />
                                    </svg><span>전체</span><input type="checkbox" name="library-search" value="all"
                                        checked hidden></label>
                                <label class="filter-check-item checked" data-filter="title"><svg class="cs-check"
                                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="20 6 9 17 4 12" />
                                    </svg><span>제목</span><input type="checkbox" name="library-search" value="title"
                                        checked hidden></label>
                                <label class="filter-check-item checked" data-filter="content"><svg class="cs-check"
                                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="20 6 9 17 4 12" />
                                    </svg><span>본문</span><input type="checkbox" name="library-search" value="content"
                                        checked hidden></label>
                                <label class="filter-check-item checked" data-filter="user"><svg class="cs-check"
                                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="20 6 9 17 4 12" />
                                    </svg><span>사용자</span><input type="checkbox" name="library-search" value="user"
                                        checked hidden></label>
                                <label class="filter-check-item checked" data-filter="hashtag"><svg class="cs-check"
                                        viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <polyline points="20 6 9 17 4 12" />
                                    </svg><span>해시태그</span><input type="checkbox" name="library-search" value="hashtag"
                                        checked hidden></label>
                            </div>
                        </div>
                        <button class="btn btn-primary">검색</button>
                    </div>
                    <div class="custom-select" style="width:9.5rem">
                        <button type="button" class="custom-select-trigger">
                            <span class="cs-value">최신순</span>
                            <svg class="cs-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <path d="m6 9 6 6 6-6" />
                            </svg>
                        </button>
                        <div class="custom-select-popover align-right">
                            <div class="custom-select-item selected" data-value="latest"><svg class="cs-check"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="20 6 9 17 4 12" />
                                </svg><span class="cs-label">최신순</span></div>
                            <div class="custom-select-item" data-value="views"><svg class="cs-check" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="20 6 9 17 4 12" />
                                </svg><span class="cs-label">조회수순</span></div>
                            <div class="custom-select-item" data-value="stars"><svg class="cs-check" viewBox="0 0 24 24"
                                    fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="20 6 9 17 4 12" />
                                </svg><span class="cs-label">인기순</span></div>
                            <div class="custom-select-item" data-value="price-low"><svg class="cs-check"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="20 6 9 17 4 12" />
                                </svg><span class="cs-label">가격 낮은순</span></div>
                            <div class="custom-select-item" data-value="price-high"><svg class="cs-check"
                                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="20 6 9 17 4 12" />
                                </svg><span class="cs-label">가격 높은순</span></div>
                        </div>
                    </div>
                </div>

				<!-- API Cards Grid -->
				<div id="library-grid"
				     style="display:grid; gap:1rem; grid-template-columns:repeat(auto-fill, minmax(320px, 1fr))">
				</div>
			
                <!-- Pagination -->
                <div class="pagination" id="library-nav"></div>

            </div>
        </main>
    </th:block>
    <th:block layout:fragment="script">
	<script src="/js/pagination.js"></script>
	
        <script>
            (function () {
                var btn = document.getElementById('library-filter-btn');
                var dropdown = document.getElementById('library-filter-dropdown');
                var countEl = document.getElementById('library-filter-count');
                var items = dropdown.querySelectorAll('.filter-check-item');
                var allItem = dropdown.querySelector('[data-filter="all"]');

                btn.addEventListener('click', function (e) {
                    e.stopPropagation();
                    dropdown.classList.toggle('open');
                    btn.classList.toggle('active');
                });

                document.addEventListener('click', function (e) {
                    if (!dropdown.contains(e.target) && !btn.contains(e.target)) {
                        dropdown.classList.remove('open');
                        btn.classList.remove('active');
                    }
                });

                function updateCount() {
                    var count = dropdown.querySelectorAll('.filter-check-item.checked').length;
                    countEl.textContent = count;
                    countEl.style.display = count > 0 ? '' : 'none';
                }

                items.forEach(function (item) {
                    item.addEventListener('click', function (e) {
                        e.preventDefault();
                        e.stopPropagation();
                        var isAll = this.getAttribute('data-filter') === 'all';
                        if (isAll) {
                            var setTo = !this.classList.contains('checked');
                            items.forEach(function (i) {
                                i.classList.toggle('checked', setTo);
                                i.querySelector('input').checked = setTo;
                            });
                        } else {
                            this.classList.toggle('checked');
                            this.querySelector('input').checked = this.classList.contains('checked');
                            var others = dropdown.querySelectorAll('.filter-check-item:not([data-filter="all"])');
                            var allChecked = Array.prototype.every.call(others, function (i) { return i.classList.contains('checked'); });
                            allItem.classList.toggle('checked', allChecked);
                            allItem.querySelector('input').checked = allChecked;
                        }
                        updateCount();
                    });
                });

                updateCount();
            })();
        </script>
		<script src="/js/library-page.js"></script>
    </th:block>
</body>

</html>
