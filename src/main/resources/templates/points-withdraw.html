<!DOCTYPE html>
<html lang="ko" layout:decorate="~{common/layout}">
<head>
    <title layout:fragment="title">포인트 환전 - GetAPI</title>
  <th:block layout:fragment="metatags">
  <meta name="description" content="보유한 포인트를 현금으로 환전합니다">
  </th:block>
</head>
<body>
  <!-- MAIN -->
  <th:block layout:fragment="content">

  <main class="main-content" style="background:color-mix(in srgb, var(--muted) 30%, transparent)">
    <div class="container" style="max-width:42rem; padding-top:2rem; padding-bottom:2rem">

      <a href="points.html" class="back-link">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        포인트로 돌아가기
      </a>

      <div style="margin-bottom:2rem">
        <h1 style="font-size:1.5rem; font-weight:700; color:var(--foreground)">포인트 환전</h1>
        <p style="margin-top:0.5rem; color:var(--muted-foreground)">보유한 포인트를 현금으로 환전합니다.</p>
      </div>

      <!-- Current Points -->
      <div class="card" style="margin-bottom:1.5rem">
        <div class="card-body" style="display:flex; align-items:center; justify-content:space-between; padding:1.5rem">
          <div>
            <p class="text-sm text-muted">환전 가능 포인트</p>
            <p style="font-size:1.875rem; font-weight:700; color:var(--primary); display:flex; align-items:center; gap:0.5rem">
              <svg style="width:2rem; height:2rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/></svg>
              12,500 P
            </p>
          </div>
        </div>
      </div>

      <!-- Withdraw Form Card -->
      <div class="card">
        <div class="card-header">
          <h2 class="card-title flex items-center gap-2">
            <svg class="icon-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
            환전 신청
          </h2>
          <p class="card-description">최소 환전 금액은 10,000P입니다. 환전 수수료 500P가 차감됩니다.</p>
        </div>
        <div class="card-body" style="display:flex; flex-direction:column; gap:1.5rem">
          <!-- Amount -->
          <div class="form-group">
            <label class="form-label" for="withdraw-amount">환전할 포인트</label>
            <div class="flex gap-3">
              <input class="form-input" type="number" id="withdraw-amount" placeholder="10000" min="10000" max="12500">
              <span style="display:flex; align-items:center; color:var(--muted-foreground)">P</span>
            </div>
            <div class="flex gap-2" style="margin-top:0.5rem">
              <button class="btn btn-outline btn-sm" onclick="document.getElementById('withdraw-amount').value='10000'">최소</button>
              <button class="btn btn-outline btn-sm" onclick="document.getElementById('withdraw-amount').value='6250'">50%</button>
              <button class="btn btn-outline btn-sm" onclick="document.getElementById('withdraw-amount').value='12500'">전체</button>
            </div>
          </div>

          <!-- Bank Account Info -->
          <div style="border-radius:var(--radius-lg); border:1px solid var(--border); padding:1rem; display:flex; flex-direction:column; gap:1rem">
            <h4 class="flex items-center gap-2 font-medium text-foreground">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2" ry="2"/><path d="M9 22v-4h6v4"/><path d="M8 6h.01"/><path d="M16 6h.01"/><path d="M12 6h.01"/><path d="M12 10h.01"/><path d="M12 14h.01"/><path d="M16 10h.01"/><path d="M16 14h.01"/><path d="M8 10h.01"/><path d="M8 14h.01"/></svg>
              입금 계좌 정보
            </h4>
            <div class="form-group">
              <label class="form-label" for="bank">은행명</label>
              <input class="form-input" type="text" id="bank" placeholder="국민은행">
            </div>
            <div class="form-group">
              <label class="form-label" for="account">계좌번호</label>
              <input class="form-input" type="text" id="account" placeholder="123-456-789012">
            </div>
            <div class="form-group">
              <label class="form-label" for="holder">예금주</label>
              <input class="form-input" type="text" id="holder" placeholder="홍길동">
            </div>
          </div>

          <!-- Alert -->
          <div class="alert">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
            <div>환전 신청 후 영업일 기준 1-3일 내 입금됩니다. 환전 수수료 500P가 차감됩니다.</div>
          </div>

          <button class="btn btn-primary btn-lg w-full">환전 신청하기</button>
        </div>
      </div>
    </div>
  </main>
  </th:block>
</body>
</html>
