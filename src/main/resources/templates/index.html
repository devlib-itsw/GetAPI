<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<title>DevLib</title>
</head>
<body>
	
	
	
	<div th:if="${!loggedIn}" class="profile-container">
	        <h1>로그인</h1>
	        <a href="/oauth2/authorization/google" class="login-btn">
	            Google로 로그인
	        </a>
	    </div>
	    
    <!-- 로그인 된 경우 -->
    <div th:if="${loggedIn}" class="profile-container">
        <h1>환영합니다!</h1>
        <img th:src="${picture}" alt="Profile Picture" style="width: 100px; height: 100px; border-radius: 50%; box-shadow: 0px 4px 10px 3px rgba(0, 0, 0, 0.1);">
        <p>이름: <span th:text="${name}"></span></p>
        <p>이메일: <span th:text="${email}"></span></p>
        
        <!-- 로그아웃 버튼 -->
        <form action="/logout" method="post">
            <button type="submit" class="logout-btn">로그아웃</button>
        </form>
        
        <!-- 또는 링크 방식 -->
        <!-- <a href="/logout" class="logout-btn">로그아웃</a> -->
    </div>
</body>
</html>
