<!DOCTYPE html>
<html lang="ko" layout:decorate="~{common/layout}">

<head>
    <title layout:fragment="title">로그인 - GetAPI</title>
    <th:block layout:fragment="metatags">
        <meta name="description" content="서비스에 로그인하세요">
    </th:block>
</head>

<body>
    <!-- MAIN -->
    <th:block layout:fragment="content">
        <main class="main-content flex items-center justify-center bg-muted-30" style="padding:4rem 1rem">
            <div class="card" style="width:100%; max-width:28rem">
                <div class="card-header" style="text-align:center; padding:1.5rem 1.5rem 0">
                    <div
                        style="width:3rem; height:3rem; border-radius:var(--radius-xl); background:var(--primary); display:flex; align-items:center; justify-content:center; margin:0 auto 1rem">
                        <span style="font-size:1.125rem; font-weight:700; color:var(--primary-foreground)">API</span>
                    </div>
                    <h1 class="card-title text-2xl">로그인</h1>
                    <p class="card-description">APIHub에 로그인하여 API 마켓플레이스를 이용하세요</p>
                </div>
                <div class="card-content space-y-6">
                    <button class="btn btn-outline w-full gap-3"
                        style="padding:0.75rem 1rem; min-height:2.75rem; font-size:0.9375rem">
                        <svg class="icon-md" viewBox="0 0 24 24">
                            <path fill="currentColor"
                                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                            <path fill="currentColor"
                                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                            <path fill="currentColor"
                                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                            <path fill="currentColor"
                                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
                        </svg>
                        Google로 계속하기
                    </button>

                    <p class="text-center text-sm text-muted" style="line-height:1.6">
                        Google 계정으로 간편하게 로그인하세요.<br>
                        계정이 없으면 자동으로 회원가입됩니다.
                    </p>

                    <p class="text-center text-xs text-muted">
                        계속 진행함으로써
                        <a href="#" style="text-decoration:underline; color:var(--muted-foreground)">이용약관</a>과
                        <a href="#" style="text-decoration:underline; color:var(--muted-foreground)">개인정보처리방침</a>에
                        동의합니다.
                    </p>
                </div>
            </div>
        </main>
    </th:block>
    <th:block layout:fragment="script">

    </th:block>
</body>

</html>
