<!DOCTYPE html>
<html lang="ko" layout:decorate="~{common/layout-minimal}">

<head>
    <title layout:fragment="title">기기 인증 - GetAPI</title>
</head>

<body>
    <th:block layout:fragment="content">
        <main class="main-content flex items-center justify-center bg-muted-30" style="padding:4rem 1rem">
            <div class="card" style="width:100%; max-width:28rem">
                <div class="card-header" style="text-align:center; padding:1.5rem 1.5rem 0">
                    <div style="width:3rem; height:3rem; border-radius:var(--radius-xl); background:var(--primary); display:flex; align-items:center; justify-content:center; margin:0 auto 1rem">
                        <span style="font-size:1.125rem; font-weight:700; color:var(--primary-foreground)">API</span>
                    </div>
                    <h1 class="card-title text-2xl">기기 인증</h1>
                    <p class="card-description">Go 클라이언트에 표시된 코드를 입력하여 기기를 연결하세요</p>
                </div>

                <div class="card-content space-y-6">

                    <!-- 로그인 안 된 경우 -->
                    <th:block th:if="${!loggedIn}">
                        <div style="background:var(--muted); border-radius:var(--radius); padding:1rem; text-align:center; margin-bottom:0.5rem">
                            <p class="text-sm text-muted" style="margin-bottom:0.75rem">
                                기기를 연결하려면 먼저 로그인이 필요합니다.
                            </p>
                        </div>
                        <a href="/auth/device/oauth-start"
                           class="btn btn-outline w-full gap-3"
                           style="padding:0.75rem 1rem; min-height:2.75rem; font-size:0.9375rem; display:flex; align-items:center; justify-content:center; text-decoration:none">
                            <svg style="width:1.25rem; height:1.25rem; flex-shrink:0" viewBox="0 0 24 24">
                                <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                                <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                            </svg>
                            Google로 로그인하기
                        </a>
                        <p class="text-center text-xs text-muted">
                            로그인 후 기기 인증 페이지로 자동으로 돌아옵니다.
                        </p>
                    </th:block>

                    <!-- 로그인 된 경우 -->
                    <th:block th:if="${loggedIn}">
                        <div id="input-section">
                            <label class="label" style="display:block; margin-bottom:0.5rem; font-size:0.875rem; font-weight:500">
                                인증 코드
                            </label>
                            <input id="userCodeInput"
                                   type="text"
                                   class="input"
                                   placeholder="XXXX-XXXX"
                                   maxlength="9"
                                   style="width:100%; text-align:center; font-size:1.25rem; font-weight:600; letter-spacing:0.15em; text-transform:uppercase"
                                   oninput="formatCode(this)" />
                            <p class="text-xs text-muted" style="margin-top:0.5rem; text-align:center">
                                Go 클라이언트 터미널에 표시된 8자리 코드를 입력하세요
                            </p>
                        </div>

                        <button id="approveBtn" onclick="approveCode()" class="btn btn-primary w-full" style="min-height:2.75rem; font-size:0.9375rem">
                            기기 연결 승인
                        </button>

                        <div id="result-message" style="display:none; border-radius:var(--radius); padding:0.875rem; text-align:center; font-size:0.9375rem; font-weight:500"></div>
                    </th:block>

                </div>
            </div>
        </main>
    </th:block>

    <th:block layout:fragment="script">
        <script>
            function formatCode(input) {
                let val = input.value.replace(/[^A-Za-z0-9]/g, '').toUpperCase();
                if (val.length > 4) {
                    val = val.slice(0, 4) + '-' + val.slice(4, 8);
                }
                input.value = val;
            }

            async function approveCode() {
                const btn = document.getElementById('approveBtn');
                const resultEl = document.getElementById('result-message');
                const userCode = document.getElementById('userCodeInput').value.trim();

                if (userCode.length < 9) {
                    showResult('코드를 올바르게 입력하세요 (XXXX-XXXX)', false);
                    return;
                }

                btn.disabled = true;
                btn.textContent = '처리 중...';

                try {
                    const resp = await fetch('/auth/device/approve', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                        body: 'userCode=' + encodeURIComponent(userCode)
                    });

                    const data = await resp.json();

                    if (resp.ok) {
                        showResult('✓ 기기 연결이 완료되었습니다! 클라이언트 터미널을 확인하세요.', true);
                        document.getElementById('input-section').style.display = 'none';
                        btn.style.display = 'none';
                    } else if (data.redirect) {
                        // 세션 만료 → 서버에서 쿠키 삭제됨, 페이지 새로고침으로 로그인 화면 표시
                        showResult(data.message || '세션이 만료되었습니다. 다시 로그인해 주세요.', false);
                        setTimeout(() => { location.href = data.redirect; }, 1500);
                    } else {
                        showResult(data.message || '오류가 발생했습니다.', false);
                        btn.disabled = false;
                        btn.textContent = '기기 연결 승인';
                    }
                } catch (e) {
                    showResult('네트워크 오류가 발생했습니다.', false);
                    btn.disabled = false;
                    btn.textContent = '기기 연결 승인';
                }
            }

            function showResult(message, success) {
                const el = document.getElementById('result-message');
                el.textContent = message;
                el.style.display = 'block';
                el.style.background = success ? 'rgba(34,197,94,0.12)' : 'rgba(239,68,68,0.12)';
                el.style.color = success ? '#16a34a' : '#dc2626';
                el.style.border = success ? '1px solid rgba(34,197,94,0.3)' : '1px solid rgba(239,68,68,0.3)';
            }
        </script>
    </th:block>
</body>

</html>
