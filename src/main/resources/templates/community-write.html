<!DOCTYPE html>
<html lang="ko" layout:decorate="~{common/layout}">

<head>
    <title layout:fragment="title">새 글 작성 - Community - GetAPI</title>
    <th:block layout:fragment="metatags">
        <meta name="description" content="GetAPI 커뮤니티 글 등록">
    </th:block>
    <th:block layout:fragment="style">
    </th:block>
</head>

<body>
    <!-- MAIN -->
    <th:block layout:fragment="content">
        <main class="main-content bg-muted-30">
            <div style="max-width:48rem; margin:0 auto; padding:2rem 1rem">
                <a href="community.html"
                    class="inline-flex items-center gap-2 text-sm text-muted mb-6 hover\:text-primary"
                    style="display:inline-flex">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="m12 19-7-7 7-7" />
                        <path d="M19 12H5" />
                    </svg>
                    목록으로 돌아가기
                </a>

                <div class="card">
                    <div class="card-header">
                        <h1 class="card-title">새 글 작성</h1>
                    </div>
                    <div class="card-content">
                        <form class="space-y-6" onsubmit="return false">
                            <div class="space-y-2">
                                <label class="label" for="title">제목</label>
                                <input class="input" id="title" placeholder="제목을 입력하세요" required>
                            </div>
                            <div class="space-y-2">
                                <label class="label" for="content">내용</label>
                                <textarea class="textarea" id="content" placeholder="내용을 입력하세요..." rows="15"
                                    required></textarea>
                                <p class="text-xs text-muted">마크다운 문법을 지원합니다. (## 제목, **굵게**, - 목록 등)</p>
                            </div>
                            <div class="space-y-2">
                                <label class="label" for="tags">태그</label>
                                <div class="tag-input-wrapper" data-max-tags="5">
                                    <div class="tag-list"></div>
                                    <input class="tag-input" id="tags" placeholder="태그 입력 후 Enter (최대 5개)">
                                </div>
                            </div>
                            <div class="flex items-center justify-end gap-3 border-t pt-6">
                                <a href="community.html" class="btn btn-outline">취소</a>
                                <button type="submit" class="btn btn-primary">게시하기</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </th:block>
    <th:block layout:fragment="script">
    </th:block>
</body>

</html>
