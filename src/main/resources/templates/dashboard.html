<!DOCTYPE html>
<html lang="ko" layout:decorate="~{common/layout}">

<head>
    <title layout:fragment="title">Dashboard - GetAPI</title>
    <th:block layout:fragment="metatags">
        <meta name="description" content="GetAPI 개발자 API 관리 페이지">
    </th:block>
    <th:block layout:fragment="style">
    </th:block>
</head>

<body>
    <!-- MAIN -->
    <th:block layout:fragment="content">
        <main class="main-content bg-muted-30">
            <div class="container py-8">
                <div class="mb-8 flex flex-wrap gap-4 items-center justify-between">
                    <div>
                        <h1 class="text-3xl font-bold text-foreground">Dashboard</h1>
                        <p class="mt-2 text-muted">판매 중인 API를 관리하고 성과를 확인하세요</p>
                    </div>
                    <a th:href="@{/api/dashboard/create}" class="btn btn-primary gap-2">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M5 12h14" />
                            <path d="M12 5v14" />
                        </svg>
                        새 API 등록
                    </a>
                </div>

                <!-- Stats -->
                <div class="mb-8"
                    style="display:grid; gap:1rem; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr))">
                    <div class="stat-card">
                        <div class="flex items-center justify-between">
                            <svg class="icon-md text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="22 7 13.5 15.5 8.5 10.5 2 17" />
                                <polyline points="16 7 22 7 22 13" />
                            </svg>
                        </div>
                        <p class="stat-value" th:text="${#numbers.formatInteger(totalCalls, 0, 'COMMA')}">0</p>
                        <p class="stat-label">총 API 호출</p>
                    </div>
                    <div class="stat-card">
                        <div class="flex items-center justify-between">
                            <svg class="icon-md text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                        </div>
                        <p class="stat-value" th:text="${#numbers.formatInteger(todayCalls, 0, 'COMMA')}">0</p>
                        <p class="stat-label">오늘 호출</p>
                    </div>
                    <div class="stat-card">
                        <div class="flex items-center justify-between">
                            <svg class="icon-md text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="8" cy="8" r="6" />
                                <path d="M18.09 10.37A6 6 0 1 1 10.34 18" />
                                <path d="M7 6h1v4" />
                                <path d="m16.71 13.88.7.71-2.82 2.82" />
                            </svg>
                        </div>
                        <p class="stat-value"><span th:text="${#numbers.formatInteger(totalRevenue, 0, 'COMMA')}">0</span> P</p>
                        <p class="stat-label">총 수익</p>
                    </div>
                    <div class="stat-card">
                        <div class="flex items-center justify-between">
                            <svg class="icon-md text-muted" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
                            </svg>
                        </div>
                        <p class="stat-value" th:text="${#lists.size(apiStats)}">0</p>
                        <p class="stat-label">등록된 API</p>
                    </div>
                </div>

                <!-- Search & Sort -->
                <div class="mb-4 flex flex-wrap gap-3 items-center justify-between">
                    <div class="flex items-center gap-2" style="flex:1; max-width:28rem">
                        <div style="position:relative; flex:1">
                            <svg style="position:absolute; left:0.75rem; top:50%; transform:translateY(-50%)" class="icon text-muted"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>
                            </svg>
                            <input id="dashboard-search" class="input" type="text" placeholder="API 이름으로 검색..." style="padding-left:2.5rem">
                        </div>
                        <button class="btn btn-primary" id="btn-dashboard-search">검색</button>
                    </div>
                    <div class="custom-select" style="width:10rem">
                        <button type="button" class="custom-select-trigger">
                            <span class="cs-value">수익순</span>
                            <svg class="cs-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="m6 9 6 6 6-6"/>
                            </svg>
                        </button>
                        <div class="custom-select-popover align-right">
                            <div class="custom-select-item selected" data-value="revenue"><svg class="cs-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg><span class="cs-label">수익순</span></div>
                            <div class="custom-select-item" data-value="calls"><svg class="cs-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg><span class="cs-label">호출수순</span></div>
                            <div class="custom-select-item" data-value="name"><svg class="cs-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg><span class="cs-label">이름순</span></div>
                        </div>
                    </div>
                </div>

                <!-- API List -->
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">내 API 목록</h2>
                    </div>
                    <div class="card-content space-y-4" id="dashboard-list">
                        <p class="text-center py-12 text-muted">불러오는 중...</p>
                    </div>
                </div>

                <!-- Pagination -->
                <div class="pagination mt-4" id="dashboard-nav"></div>
            </div>
        </main>
    </th:block>
    <th:block layout:fragment="script">
    <script src="/js/Pagination.js"></script>
    <script>
    const dashboardPaginator = new DataPaginator({
        apiUrl: '/api/dashboard/list',
        bodyContainer: '#dashboard-list',
        navContainer: '#dashboard-nav',
        getSearchParams: () => ({
            keyword: document.getElementById('dashboard-search').value.trim(),
            sort: document.querySelector('.custom-select-item.selected')?.dataset.value || 'revenue'
        }),
        renderRow: (item) => `
            <a href="/api/dashboard/view/${item.apiUuid}"
               class="flex flex-wrap gap-4 items-center justify-between rounded-lg p-4 transition-all hover:shadow-sm"
               style="border:1px solid var(--border); display:flex">
                <div class="flex items-center gap-4">
                    <div style="width:3rem; height:3rem; border-radius:var(--radius-lg); background:rgba(0,199,126,0.1); display:flex; align-items:center; justify-content:center">
                        <span class="text-lg font-bold text-primary">${item.name ? item.name[0].toUpperCase() : '?'}</span>
                    </div>
                    <div>
                        <h3 class="font-semibold text-foreground">${item.name}</h3>
                        <p class="text-sm text-muted">오늘 ${item.todayCalls.toLocaleString()}회 호출</p>
                    </div>
                </div>
                <div class="flex gap-6 text-center">
                    <div>
                        <p class="text-lg font-semibold text-foreground">${item.totalCalls.toLocaleString()}</p>
                        <p class="text-xs text-muted">총 호출</p>
                    </div>
                    <div>
                        <p class="text-lg font-semibold text-foreground">${item.totalRevenue.toLocaleString()} P</p>
                        <p class="text-xs text-muted">수익</p>
                    </div>
                </div>
            </a>`
    });

    dashboardPaginator.load(0);

    /* 검색 */
    document.getElementById('dashboard-search').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') dashboardPaginator.load(0);
    });

    document.getElementById('btn-dashboard-search').addEventListener('click', function() {
        dashboardPaginator.load(0);
    });

    /* 정렬 */
    document.querySelectorAll('.custom-select-item').forEach(function(item) {
        item.addEventListener('click', function() {
            document.querySelectorAll('.custom-select-item').forEach(i => i.classList.remove('selected'));
            this.classList.add('selected');
            document.querySelector('.cs-value').textContent = this.querySelector('.cs-label').textContent;
            dashboardPaginator.load(0);
        });
    });
    </script>
    </th:block>
</body>

</html>
