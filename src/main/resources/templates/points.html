<!DOCTYPE html>
<html lang="ko" layout:decorate="~{common/layout}">

<head>
	<title layout:fragment="title">포인트 - GetAPI</title>
	<th:block layout:fragment="metatags">
		<meta name="description" content="포인트를 충전하고 관리하세요">
	</th:block>
</head>

<body>
	<!-- MAIN -->
	<th:block layout:fragment="content">
		<main class="main-content" style="background:color-mix(in srgb, var(--muted) 30%, transparent)">
			<div class="container" style="max-width:56rem; padding-top:2rem; padding-bottom:2rem">

				<div style="margin-bottom:2rem">
					<h1 style="font-size:1.875rem; font-weight:700; color:var(--foreground)">포인트</h1>
					<p style="margin-top:0.5rem; color:var(--muted-foreground)">포인트를 충전하고 관리하세요</p>
				</div>

				<!-- Current Points Banner -->
				<div class="card" style="margin-bottom:2rem">
					<div class="card-body"
						style="display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; padding:1.5rem; gap:1rem">
						<div>
							<p class="text-sm text-muted">현재 보유 포인트</p>
							<p
								style="font-size:1.875rem; font-weight:700; color:var(--primary); display:flex; align-items:center; gap:0.5rem">
								<svg style="width:2rem; height:2rem" viewBox="0 0 24 24" fill="none"
									stroke="currentColor" stroke-width="2" stroke-linecap="round"
									stroke-linejoin="round">
									<circle cx="8" cy="8" r="6" />
									<path d="M18.09 10.37A6 6 0 1 1 10.34 18" />
									<path d="M7 6h1v4" />
									<path d="m16.71 13.88.7.71-2.82 2.82" />
								</svg>

								<span style="font-size:1.875rem; font-weight:700; color:var(--foreground)"
									th:text="${loginUser != null and loginUser.point != null ? #numbers.formatInteger(loginUser.point, 0, 'COMMA') + ' P' : '0 P'}">
									0 P
								</span>
							</p>
						</div>
						<div class="flex gap-3">
							<a th:href="@{|/payments/withdraw|}" class="btn btn-outline">포인트 환전</a>
							<a href="points-auto.html" class="btn btn-outline">정기 충전 설정</a>
						</div>
					</div>
				</div>

				<!-- Tabs -->
				<div class="tabs" style="margin-bottom:1.5rem">
					<button class="tab-btn active" data-tab="charge">
						<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
							stroke-linecap="round" stroke-linejoin="round">
							<rect width="20" height="14" x="2" y="5" rx="2" />
							<line x1="2" x2="22" y1="10" y2="10" />
						</svg>
						충전하기
					</button>
					<button class="tab-btn" data-tab="history">
						<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
							stroke-linecap="round" stroke-linejoin="round">
							<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
							<path d="M3 3v5h5" />
							<path d="M12 7v5l4 2" />
						</svg>
						이용 내역
					</button>
				</div>

				<!-- Tab: Charge -->
				<div class="tab-content active" id="tab-charge">
					<div class="card">
						<div class="card-header">
							<h2 class="card-title">포인트 충전</h2>
							<p class="card-description">충전할 금액을 선택하세요</p>
						</div>
						<div class="card-body" style="display:flex; flex-direction:column; gap:1.5rem">
							<!-- Package Options -->
							<div style="display:grid; gap:0.75rem; grid-template-columns:repeat(auto-fill, minmax(14rem, 1fr))"
								id="packages">
								<label class="radio-card selected" data-value="5000">
									<input type="radio" name="package" value="5000" checked hidden>
									<div
										style="display:flex; align-items:center; justify-content:space-between; width:100%">
										<div>
											<p class="font-medium text-foreground">5,000 P</p>
											<p class="text-sm text-muted">5,000원</p>
										</div>
									</div>
								</label>
								<label class="radio-card" data-value="10000">
									<input type="radio" name="package" value="10000" hidden>
									<div
										style="display:flex; align-items:center; justify-content:space-between; width:100%">
										<div>
											<p class="font-medium text-foreground">10,000 P</p>
											<p class="text-sm text-muted">10,000원</p>
										</div>
										<span class="badge"
											style="background:color-mix(in srgb, var(--primary) 10%, transparent); color:var(--primary)">+500
											보너스</span>
									</div>
								</label>
								<label class="radio-card" data-value="30000">
									<input type="radio" name="package" value="30000" hidden>
									<div
										style="display:flex; align-items:center; justify-content:space-between; width:100%">
										<div>
											<p class="font-medium text-foreground">30,000 P</p>
											<p class="text-sm text-muted">30,000원</p>
										</div>
										<span class="badge"
											style="background:color-mix(in srgb, var(--primary) 10%, transparent); color:var(--primary)">+2,000
											보너스</span>
									</div>
								</label>
								<label class="radio-card" data-value="50000">
									<input type="radio" name="package" value="50000" hidden>
									<div
										style="display:flex; align-items:center; justify-content:space-between; width:100%">
										<div>
											<p class="font-medium text-foreground">50,000 P</p>
											<p class="text-sm text-muted">50,000원</p>
										</div>
										<span class="badge"
											style="background:color-mix(in srgb, var(--primary) 10%, transparent); color:var(--primary)">+5,000
											보너스</span>
									</div>
								</label>
								<label class="radio-card" data-value="100000">
									<input type="radio" name="package" value="100000" hidden>
									<div
										style="display:flex; align-items:center; justify-content:space-between; width:100%">
										<div>
											<p class="font-medium text-foreground">100,000 P</p>
											<p class="text-sm text-muted">100,000원</p>
										</div>
										<span class="badge"
											style="background:color-mix(in srgb, var(--primary) 10%, transparent); color:var(--primary)">+15,000
											보너스</span>
									</div>
								</label>
							</div>

							<!-- Custom Amount -->
							<div class="form-group">
								<label class="form-label" for="custom-amount">직접 입력</label>
								<div class="flex gap-3">
									<input class="form-input" type="number" id="custom-amount" placeholder="충전할 금액 (원)">
									<span
										style="display:flex; align-items:center; color:var(--muted-foreground)">원</span>
								</div>
								<p class="form-hint">최소 1,000원부터 충전 가능합니다. (1원 = 1포인트)</p>
							</div>

							<button class="btn btn-primary btn-lg w-full gap-2" onclick="requestPayment()">
								결제하기
								<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
									stroke-linecap="round" stroke-linejoin="round">
									<path d="M5 12h14" />
									<path d="m12 5 7 7-7 7" />
								</svg>
							</button>

							<div class="alert">
								<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
									stroke-linecap="round" stroke-linejoin="round">
									<circle cx="12" cy="12" r="10" />
									<path d="M12 16v-4" />
									<path d="M12 8h.01" />
								</svg>
								<div>결제는 카드 결제, 간편결제(카카오페이, 네이버페이 등)로 가능합니다.</div>
							</div>
						</div>
					</div>
				</div>

				<!-- Tab: History -->
				<div class="tab-content" id="tab-history" style="display:none">
				    <div class="card">
				        <div class="card-header">
				            <h2 class="card-title">이용 내역</h2>
				            <p class="card-description">최근 포인트 사용 및 충전 내역</p>
				        </div>
				        <div class="card-body" style="display:flex; flex-direction:column; gap:1rem" id="history-list">
				            <!-- 로딩 중 표시 -->
				            <p class="text-sm text-muted" id="history-loading">불러오는 중...</p>
				        </div>
				    </div>
				</div>

			</div>
		</main>
	</th:block>
	<th:block layout:fragment="script">
		<script th:inline="javascript">
			/* ── 1. 탭 전환 (Tab Switching) ── */
			document.querySelectorAll('.tab-btn').forEach(function (btn) {
				btn.addEventListener('click', function () {
					// 모든 버튼에서 active 제거
					document.querySelectorAll('.tab-btn').forEach(function (b) {b.classList.remove('active');});
					// 모든 컨텐츠 숨기기
					document.querySelectorAll('.tab-content').forEach(function (c) {
						c.style.display = 'none';
						c.classList.remove('active');
					});

					// 클릭한 탭 활성화
					this.classList.add('active');
					const targetId = 'tab-' + this.getAttribute('data-tab');
					const target = document.getElementById(targetId);
					if (target) {
						target.style.display = '';
						target.classList.add('active');
					}
					if (this.getAttribute('data-tab') === 'history') {
					  	loadHistory();
					}
				});
			});

			/* ── 2. 충전 금액 선택 (Radio Card Selection) ── */
			document.querySelectorAll('.radio-card').forEach(function (card) {
				card.addEventListener('click', function () {
					document.querySelectorAll('.radio-card').forEach(function (c) {c.classList.remove('selected');});
					this.classList.add('selected');

					// 직접 입력 필드 초기화 (선택 시 혼선 방지)
					document.getElementById('custom-amount').value = '';
				});
			});

			/* ── 3. 토스 결제 요청 (Toss Payments) ── */
			async function requestPayment() {
				// 본인의 토스 테스트 클라이언트 키
				const clientKey = 'test_ck_AQ92ymxN34N7RqAB1vlPrajRKXvd';
				const tossPayments = TossPayments(clientKey);

				// 결제 금액 결정 (선택된 카드 또는 직접 입력값)
				const activeCard = document.querySelector('.radio-card.selected');
				const customAmount = document.getElementById('custom-amount').value;

				let amount = activeCard ? parseInt(activeCard.getAttribute('data-value')) : 5000;
				if (customAmount) {
					amount = parseInt(customAmount);
				}

				if (amount < 1000) {
					alert("최소 충전 금액은 1,000원입니다.");
					return;
				}

				// 서버(Redis)에 저장할 데이터 구성
				const paymentData = {
					orderId: 'APIHUB-' + Math.random().toString(36).substring(2, 12),
					amount: amount
				};

				try {
					// [중요] 1. 서버에 먼저 결제 대기 정보 저장 (비동기)
					// 현재 도메인이 localhost:8080이면 상대 경로 '/payments/save'로 써도 무방합니다.
					const saveResponse = await fetch('/payments/save', {
						method: 'POST',
						headers: {
							'Content-Type': 'application/json'
						},
						body: JSON.stringify(paymentData)
					});

					if (!saveResponse.ok) {
						throw new Error("서버 결제 정보 저장 실패");
					}

					console.log('Redis 저장 성공:', paymentData.orderId);

					// [중요] 2. 서버 저장 성공 후에만 토스 결제창 호출
					await tossPayments.requestPayment('카드', {
						amount: paymentData.amount,
						orderId: paymentData.orderId,
						orderName: '포인트 충전 (' + amount.toLocaleString() + 'P)',
						successUrl: window.location.origin + '/payments/confirm',
						failUrl: window.location.origin + '/points/charge', // 실패 시 돌아올 페이지
					});

				} catch (error) {
					console.error('결제 요청 중 에러 발생:', error);
					alert("결제 준비 중 오류가 발생했습니다. 잠시 후 다시 시도해주세요.");
				}
			}
			/* ── 4. 이용내역 불러오기 ── */
			function loadHistory() {
			    const list = document.getElementById('history-list');
			    list.innerHTML = '<p class="text-sm text-muted">불러오는 중...</p>';

			    fetch('/payments/history')
			        .then(function (res) {
			            if (!res.ok) throw new Error('조회 실패');
			            return res.json();
			        })
			        .then(function (data) {
			            if (data.length === 0) {
			                list.innerHTML = '<p class="text-sm text-muted">이용 내역이 없습니다.</p>';
			                return;
			            }

			            list.innerHTML = data.map(function (item, index) {
			                const isLast = index === data.length - 1;
			                const date = item.approvedAt
			                    ? item.approvedAt.substring(0, 10)   // "2026-02-05T..." → "2026-02-05"
			                    : item.paidAt ? item.paidAt.substring(0, 10) : '-';

			                return `
			                    <div style="display:flex; align-items:center; justify-content:space-between;
			                                ${isLast ? '' : 'border-bottom:1px solid var(--border); padding-bottom:1rem'}">
			                        <div>
			                            <p class="font-medium text-foreground">${item.orderName ?? '포인트 충전'}</p>
			                            <p class="text-sm text-muted">${date}</p>
			                        </div>
			                        <span class="font-semibold" style="color:var(--primary)">
			                            +${item.amount.toLocaleString()} P
			                        </span>
			                    </div>`;
			            }).join('');
			        })
			        .catch(function () {
			            list.innerHTML = '<p class="text-sm text-muted">내역을 불러오지 못했습니다.</p>';
			        });
			}
		</script>
	</th:block>
</body>

</html>
