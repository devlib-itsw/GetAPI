<!DOCTYPE html>
<html lang="ko" layout:decorate="~{common/layout}">
<head>
  <title layout:fragment="title" th:text="|프로필 - ${profileUser.isCensored ? '검열됨' : (profileUser.nickname ?: profileUser.name)} - GetAPI|">프로필 - GetAPI</title>
  <th:block layout:fragment="metatags">
  	<meta name="description" th:content="|${profileUser.isCensored ? '검열됨' : (profileUser.nickname ?: profileUser.name)} 개발자 프로필|">
  </th:block>
</head>
<body>
  <!-- MAIN -->
  <th:block layout:fragment="content">	
  <main class="main-content" style="background:color-mix(in srgb, var(--muted) 30%, transparent)">
    <div class="container" style="max-width:64rem; padding-top:2rem; padding-bottom:2rem">

      <a href="javascript:history.back()" class="back-link">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        돌아가기
      </a>

      <!-- Profile Header Card -->
      <div class="card" style="margin-bottom:2rem">
        <div class="card-body" style="padding:1.5rem">
          <div style="display:flex; flex-wrap:wrap; align-items:flex-start; gap:1rem">
            <div class="flex items-center gap-4">
				<div class="profile-wrapper">
				  <img class="profile-avatar"
				       th:src="@{/user/avatar/{uuid}(uuid=${profileUser.user.userUuid})}"
					   alt="프로필"
					  style="width:5rem; height:5rem; border-radius:50%; object-fit:cover;" >
				</div>
              <div>
                <h1 style="font-size:1.5rem; font-weight:700; color:var(--foreground)" th:text="${profileUser.isCensored ? '검열됨' : (profileUser.nickname ?: profileUser.name)}"></h1>
                <p style="margin-top:0.25rem; color:var(--muted-foreground)" th:text="${profileUser.isCensored ? '검열됨' : profileUser.introduction}"></p>
                <p style="margin-top:0.25rem; font-size:0.875rem; color:var(--muted-foreground)" th:text="${profileEmail}"></p>
                <div style="margin-top:0.5rem; display:flex; flex-wrap:wrap; align-items:center; gap:1rem; font-size:0.875rem; color:var(--muted-foreground)">
					<a th:if="${!profileUser.isCensored and profileUser.webUrl != null and !#strings.isEmpty(profileUser.webUrl)}"
					   th:href="${profileUser.webUrl}" target="_blank" rel="noopener" class="flex items-center gap-1" style="color:var(--muted-foreground)">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
					<span th:text="${profileUser.webUrl}"></span>
                    <svg class="icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
                  </a>
                  <span th:if="${profileUser.isCensored}" style="color:var(--muted-foreground)">검열됨</span>
                  <span class="flex items-center gap-1">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>
                    <span th:text="${#temporals.format(joinDate, 'yyyy-MM-dd') + ' 가입'}"></span>
                  </span>
                </div>
              </div>
            </div>
          </div>

          <!-- Stats -->
          <div style="margin-top:1.5rem; display:grid; grid-template-columns:repeat(3, 1fr); gap:1rem; border-top:1px solid var(--border); padding-top:1.5rem; text-align:center">
            <div>
              <p style="font-size:1.5rem; font-weight:700; color:var(--foreground)" th:text="${apiCount}">0</p>
              <p class="text-sm text-muted">등록 API</p>
            </div>
            <div>
              <p style="font-size:1.5rem; font-weight:700; color:var(--foreground)" th:text="${postCount}">0</p>
              <p class="text-sm text-muted">게시글</p>
            </div>
            <div>
              <p style="font-size:1.5rem; font-weight:700; color:var(--foreground)" th:text="${#numbers.formatInteger(totalCalls, 0, 'COMMA')}">0</p>
              <p class="text-sm text-muted">총 호출</p>
            </div>
          </div>
        </div>
      </div>

      <!-- Tabs -->
      <div class="tabs" style="margin-bottom:1.5rem">
        <button class="tab-btn active" data-tab="apis" th:text="|등록 API (${apiCount})|">등록 API</button>
        <button class="tab-btn" data-tab="posts" th:text="|게시글 (${postCount})|">게시글</button>
      </div>

      <!-- Tab: APIs -->
      <div class="tab-content active" id="tab-apis">
        <div style="display:grid; grid-template-columns:repeat(auto-fill, minmax(20rem, 1fr)); gap:1rem">
          <th:block th:each="api : ${apis}">
          <a th:href="@{/library/view/{uuid}(uuid=${api.apiUuid})}" class="card card-hover" style="height:100%">
            <div class="card-body" style="padding:1.25rem">
              <div style="display:flex; justify-content:space-between; margin-bottom:0.75rem">
                <h3 class="text-lg font-semibold text-foreground" th:text="${api.name}"></h3>
                <div class="points-badge">
                  <svg class="icon-xs" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/></svg>
                  <span th:text="${api.price} + 'P/호출'"></span>
                </div>
              </div>
              <p class="text-sm text-muted" style="margin-bottom:1rem; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden" th:text="${api.description}"></p>
              <div style="display:flex; gap:1rem; border-top:1px solid var(--border); padding-top:0.75rem; font-size:0.875rem; color:var(--muted-foreground)">
                <span class="flex items-center gap-1">
                  <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                  <span th:text="${#numbers.formatInteger(api.viewCount ?: 0, 0, 'COMMA')}"></span>
                </span>
              </div>
            </div>
          </a>
          </th:block>
          <div th:if="${#lists.isEmpty(apis)}" class="card" style="grid-column:1/-1">
            <div class="card-body" style="padding:2rem; text-align:center; color:var(--muted-foreground)">등록된 API가 없습니다.</div>
          </div>
        </div>
      </div>

      <!-- Tab: Posts -->
      <div class="tab-content" id="tab-posts" style="display:none">
        <div class="card">
          <div class="card-body" style="padding:0">
            <th:block th:each="post, stat : ${posts}">
            <a th:href="@{/community/view/{uuid}(uuid=${post.postUuid})}"
               th:style="${!stat.last} ? 'display:flex; align-items:center; justify-content:space-between; padding:1rem; border-bottom:1px solid var(--border)' : 'display:flex; align-items:center; justify-content:space-between; padding:1rem'">
              <div>
                <h3 class="font-medium text-foreground" th:text="${post.title}"></h3>
                <p class="text-sm text-muted" th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd')}"></p>
              </div>
              <span class="flex items-center gap-1 text-sm text-muted">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                <span th:text="${#numbers.formatInteger(post.viewCount ?: 0, 0, 'COMMA')}"></span>
              </span>
            </a>
            </th:block>
            <div th:if="${#lists.isEmpty(posts)}" style="padding:2rem; text-align:center; color:var(--muted-foreground)">작성한 게시글이 없습니다.</div>
          </div>
        </div>
      </div>
    </div>
  </main>
  </th:block>

  <th:block layout:fragment="script">
	<script th:inline="javascript">
	  /* ── Profile Tab Switching ── */
	  document.querySelectorAll('.tab-btn').forEach(function(btn) {
	    btn.addEventListener('click', function() {
	      document.querySelectorAll('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
	      document.querySelectorAll('.tab-content').forEach(function(c) { c.style.display = 'none'; c.classList.remove('active'); });
	      this.classList.add('active');
	      var target = document.getElementById('tab-' + this.getAttribute('data-tab'));
	      if (target) { target.style.display = ''; target.classList.add('active'); }
	    });
	  });
	</script>
  </th:block>
  
</body>
</html>
