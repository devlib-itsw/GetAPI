<!DOCTYPE html>
<html lang="ko" layout:decorate="~{common/layout}">
<head>
    <title layout:fragment="title">정기 충전 설정 - GetAPI</title>
  <th:block layout:fragment="metatags">
  <meta name="description" content="포인트가 부족할 때 자동으로 충전되도록 설정합니다">
  </th:block>
</head>
<body>
  <!-- MAIN -->
  <th:block layout:fragment="content">

    <main class="main-content" style="background:color-mix(in srgb, var(--muted) 30%, transparent)">
    <div class="container" style="max-width:42rem; padding-top:2rem; padding-bottom:2rem">

      <a href="points.html" class="back-link">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
        포인트로 돌아가기
      </a>

      <div style="margin-bottom:2rem">
        <h1 style="font-size:1.5rem; font-weight:700; color:var(--foreground)">정기 충전 설정</h1>
        <p style="margin-top:0.5rem; color:var(--muted-foreground)">포인트가 부족할 때 자동으로 충전되도록 설정합니다.</p>
      </div>

      <div style="display:grid; gap:1.5rem">

        <!-- Auto Charge Card -->
        <div class="card">
          <div class="card-header">
            <div style="display:flex; align-items:center; justify-content:space-between">
              <h2 class="card-title flex items-center gap-2">
                <svg class="icon-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>
                자동 충전
              </h2>
              <label class="switch-label" style="display:flex; align-items:center; gap:0.5rem; font-size:0.875rem; color:var(--muted-foreground); cursor:pointer">
                <span id="switch-label-text">비활성화</span>
                <div class="switch" id="auto-switch">
                  <div class="switch-thumb"></div>
                </div>
              </label>
            </div>
            <p class="card-description">설정한 기준 이하로 포인트가 떨어지면 자동으로 충전됩니다.</p>
          </div>
          <div class="card-body" id="auto-settings" style="display:flex; flex-direction:column; gap:1.5rem; opacity:0.5; pointer-events:none">
            <!-- Threshold -->
            <div>
              <label class="form-label">자동 충전 기준</label>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.75rem">
                <label class="radio-card"><input type="radio" name="threshold" value="1000" hidden><span class="text-sm font-medium">1,000P 이하</span></label>
                <label class="radio-card"><input type="radio" name="threshold" value="3000" hidden><span class="text-sm font-medium">3,000P 이하</span></label>
                <label class="radio-card selected"><input type="radio" name="threshold" value="5000" checked hidden><span class="text-sm font-medium">5,000P 이하</span></label>
                <label class="radio-card"><input type="radio" name="threshold" value="10000" hidden><span class="text-sm font-medium">10,000P 이하</span></label>
              </div>
              <p class="form-hint">포인트가 선택한 금액 이하가 되면 자동으로 충전됩니다.</p>
            </div>
            <!-- Charge Amount -->
            <div>
              <label class="form-label">충전 금액</label>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:0.75rem">
                <label class="radio-card"><input type="radio" name="amount" value="5000" hidden><div style="display:flex; justify-content:space-between; width:100%"><span class="font-medium">5,000P</span><span class="text-sm text-muted">5,000원</span></div></label>
                <label class="radio-card selected"><input type="radio" name="amount" value="10000" checked hidden><div style="display:flex; justify-content:space-between; width:100%"><span class="font-medium">10,000P</span><span class="text-sm text-muted">10,000원</span></div></label>
                <label class="radio-card"><input type="radio" name="amount" value="30000" hidden><div style="display:flex; justify-content:space-between; width:100%"><span class="font-medium">30,000P</span><span class="text-sm text-muted">30,000원</span></div></label>
                <label class="radio-card"><input type="radio" name="amount" value="50000" hidden><div style="display:flex; justify-content:space-between; width:100%"><span class="font-medium">50,000P</span><span class="text-sm text-muted">50,000원</span></div></label>
              </div>
            </div>
          </div>
        </div>

        <!-- Payment Card -->
        <div class="card">
          <div class="card-header">
            <h2 class="card-title flex items-center gap-2">
              <svg class="icon-md" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="5" rx="2"/><line x1="2" x2="22" y1="10" y2="10"/></svg>
              결제 수단
            </h2>
            <p class="card-description">자동 충전에 사용할 결제 수단을 등록하세요.</p>
          </div>
          <div class="card-body" style="display:flex; flex-direction:column; gap:1rem">
            <div class="alert">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
              <div>등록된 결제 수단이 없습니다. 자동 충전을 사용하려면 결제 수단을 등록하세요.</div>
            </div>
            <button class="btn btn-primary" style="align-self:flex-start">결제 수단 등록</button>
          </div>
        </div>

        <!-- Action Buttons -->
        <div style="display:flex; justify-content:flex-end; gap:0.75rem">
          <a href="points.html" class="btn btn-outline">취소</a>
          <button class="btn btn-primary" disabled>설정 저장</button>
        </div>
      </div>
    </div>
  </main>
  </th:block>
  <th:block layout:fragment="script">
	<script>
  /* ── Auto Charge Switch ── */
  var autoSwitch = document.getElementById('auto-switch');
  var settings = document.getElementById('auto-settings');
  var labelText = document.getElementById('switch-label-text');
  var enabled = false;

  autoSwitch.addEventListener('click', function() {
    enabled = !enabled;
    this.classList.toggle('active', enabled);
    settings.style.opacity = enabled ? '1' : '0.5';
    settings.style.pointerEvents = enabled ? 'auto' : 'none';
    labelText.textContent = enabled ? '활성화' : '비활성화';
  });

  /* ── Radio Card Selection ── */
  document.querySelectorAll('.radio-card').forEach(function(card) {
    card.addEventListener('click', function() {
      var name = this.querySelector('input[type="radio"]').name;
      document.querySelectorAll('input[name="' + name + '"]').forEach(function(r) {
        r.closest('.radio-card').classList.remove('selected');
      });
      this.classList.add('selected');
    });
  });
</script>
  </th:block>
</body>
</html>
