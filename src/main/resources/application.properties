spring.application.name=GetAPI

# 서버 포트
server.port=8080

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile

# MySQL (RDS)
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:getapi}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret-key=${JWT_SECRET_KEY}

# IMAP
imap.enabled=false
imap.username=${IMAP_USERNAME}
imap.password=${IMAP_PASSWORD}

logging.level.org.springframework.security=DEBUG

payment.toss.secret-key=${TOSS_SECRET}

spring.elasticsearch.uris=http://${ES_HOST:localhost}:${ES_PORT:9200}

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}

# AI Filter Server
ai.server.url=${AI_SERVER_URL:http://localhost:8888}

# Static resources cache (1 year)
spring.web.resources.cache.cachecontrol.max-age=31536000
spring.web.resources.cache.cachecontrol.cache-public=true
spring.web.resources.chain.strategy.content.enabled=true
spring.web.resources.chain.strategy.content.paths=/css/**,/js/**,/images/**

# DevTools
spring.devtools.restart.enabled=false

# Disable default Whitelabel error page
server.error.whitelabel.enabled=false
