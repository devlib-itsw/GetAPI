
spring.application.name=GetAPI

# ìë² í¬í¸ ì¤ì  (ì íì¬í­)
server.port=8080

# Google OAuth2 ì¤ì 
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
#spring.security.oauth2.client.registration.google.redirect-uri=http:/localhost:8080/login/oauth2/code/google

# H2
# 1. H2 콘솔 활성화 및 경로 설정
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# 2. 데이터베이스 연결 설정 (파일 저장 방식)
# ~/getapi 로 설정하면 사용자 폴더에 getapi.mv.db 파일이 생깁니다.
spring.datasource.url=jdbc:h2:~/getapi;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# 3. JPA 설정
# update로 해야 서버를 껐다 켜도 기존 데이터가 유지됩니다. (create는 다 삭제함)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret-key=${JWT_SECRET_KEY}

# IMAP                                                          
imap.enabled=false
imap.username=${IMAP_USERNAME}
imap.password=${IMAP_PASSWORD}

logging.level.org.springframework.security=DEBUG

payment.toss.secret-key=${TOSS_SECRET}

spring.elasticsearch.uris=http://localhost:9200

# Redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# AI Filter Server
ai.server.url=${AI_SERVER_URL:http://localhost:8888}

# DevTools - restart disabled (ClassLoaderFileRepository DELETED tracking issue with new ai package)
spring.devtools.restart.enabled=false

# Disable default Whitelabel error page
server.error.whitelabel.enabled=false